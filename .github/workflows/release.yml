name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create from the selected branch (e.g. v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: gradle/actions/setup-gradle@v6.4.0
    - uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: 17
    - name: Build
      run: ./gradlew build
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes build/libs/*.jar
